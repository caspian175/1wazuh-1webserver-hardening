---
- name: Hardening de Seguridad CIS para Wazuh Manager
  hosts: wazuh_manager
  become: yes
  become_method: sudo

  tasks:
    - name: 1. GESTIÓN DE POLÍTICAS DE CONTRASEÑAS
      name: Configurar envejecimiento de contraseñas en /etc/login.defs
      lineinfile:
        path: /etc/login.defs
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^PASS_MAX_DAYS', line: 'PASS_MAX_DAYS   90' }
        - { regexp: '^PASS_MIN_DAYS', line: 'PASS_MIN_DAYS   7' }
        - { regexp: '^PASS_WARN_AGE', line: 'PASS_WARN_AGE   7' }

    - name: Configurar complejidad de contraseñas (pam_pwquality)
      lineinfile:
        path: /etc/security/pwquality.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?minlen', line: 'minlen = 14' }
        - { regexp: '^#?dcredit', line: 'dcredit = -1' }
        - { regexp: '^#?ucredit', line: 'ucredit = -1' }
        - { regexp: '^#?lcredit', line: 'lcredit = -1' }
        - { regexp: '^#?ocredit', line: 'ocredit = -1' }

    - name: 2. DESHABILITACIÓN DE SERVICIOS INSEGUROS O INNECESARIOS
      name: Asegurar que servicios innecesarios estén detenidos y deshabilitados
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      failed_when: false
      loop:
        - postfix
        - avahi-daemon
        - cockpit.socket

    - name: 3. CONFIGURACIÓN ESTRICTA DEL FIREWALL LOCAL
      name: Asegurar que firewalld esté corriendo
      systemd:
        name: firewalld
        state: started
        enabled: yes

    - name: Permitir puertos legítimos del Wazuh Manager y Dashboard
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 22/tcp    # SSH
        - 443/tcp   # Dashboard Web (HTTPS)
        - 1514/tcp  # Comunicación de Agentes
        - 1515/tcp  # Registro de Agentes

    - name: 4. RESTRICCIÓN DE ACCESO REMOTO (SSH)
      name: Hardening del servicio SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 4' }
        - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval 300' }
        - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax 0' }
      notify: Reiniciar SSH

  handlers:
    - name: Reiniciar SSH
      systemd:
        name: sshd
        state: restarted
